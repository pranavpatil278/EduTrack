<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduTrack Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#020617,#111827);
            font-family:'Segoe UI',sans-serif;
            color:white;
        }

        .login-card{
            width:420px;
            padding:45px;
            border-radius:25px;
            background:rgba(255,255,255,.08);
            backdrop-filter:blur(18px);
            border:1px solid rgba(255,255,255,.15);
            box-shadow:0 20px 50px rgba(0,0,0,.5);
            animation:show .6s ease;
        }

        @keyframes show{
            from{
                transform:translateY(25px);
                opacity:0;
            }
            to{
                transform:translateY(0);
                opacity:1;
            }
        }

        .logo{
            text-align:center;
            margin-bottom:20px;
        }

        .logo img{
            width:100px;
            height:100px;
            object-fit:contain;
            border-radius:15px;
            transition: transform 0.4s ease;
        }

        .logo img:hover{
            transform: scale(1.15);
        }

        h2{
            text-align:center;
            font-weight:bold;
            background:linear-gradient(90deg,#38bdf8,#a855f7);
            -webkit-background-clip:text;
            color:transparent;
            margin-bottom:5px;
        }

        .subtitle{
            text-align:center;
            color:#cbd5e1;
            margin-bottom:30px;
        }

        .form-control{
            background:#020617!important;
            border:1px solid #334155!important;
            color:white!important;
            padding:14px!important;
            border-radius:15px!important;
        }

        .form-control::placeholder{
            color:#94a3b8;
        }

        .btn-login{
            background:linear-gradient(90deg,#6366f1,#06b6d4);
            border:none;
            color:white;
            padding:14px;
            border-radius:15px;
            font-weight:bold;
            width:100%;
            transition:.3s;
        }

        .btn-login:hover{
            transform:translateY(-2px);
            opacity:.95;
        }

    </style>

</head>

<body>

<div class="login-card">

    <!-- Logo -->
    <div class="logo">
        <img src="{{ url_for('static', filename='images/edutrack_logo.png') }}"
             alt="EduTrack Logo">
    </div>

    <!-- Heading -->
    <h2>Admin Login</h2>

    <p class="subtitle"></p>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}

    <div class="toast-container position-fixed top-0 end-0 p-3">

        {% for category, message in messages %}

        <div class="toast show text-bg-{{ category }} border-0 mb-2">

            <div class="d-flex">

                <div class="toast-body">
                    {{ message }}
                </div>

                <button type="button"
                        class="btn-close btn-close-white me-2 m-auto"
                        data-bs-dismiss="toast">
                </button>

            </div>

        </div>

        {% endfor %}

    </div>

    {% endif %}
    {% endwith %}

    <!-- Login Form -->
    <form method="POST" autocomplete="off">

        <input
            type="text"
            name="username"
            class="form-control mb-3"
            placeholder="Username"
            autocomplete="off"
            required>

        <input
            type="password"
            name="password"
            class="form-control mb-4"
            placeholder="Password"
            autocomplete="new-password"
            required>

        <button type="submit" class="btn btn-login">
            Login
        </button>

    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Toast Auto Hide -->
<script>
document.addEventListener("DOMContentLoaded", function () {

    const toasts = document.querySelectorAll(".toast");

    toasts.forEach(toast => {
        setTimeout(() => {
            toast.classList.remove("show");
            toast.classList.add("hide");
        }, 3000);
    });

});
</script>

<!-- FIX: Clear fields when using browser back button -->
<script>
window.addEventListener("pageshow", function (event) {

    const username = document.querySelector("input[name='username']");
    const password = document.querySelector("input[name='password']");

    if (username) username.value = "";
    if (password) password.value = "";

});
</script>

</body>
</html>
