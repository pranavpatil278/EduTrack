<!DOCTYPE html>
<html>

<head>

<title>Attendance Management</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{
margin:0;
background:
radial-gradient(circle at top,#1e1b4b,transparent 35%),
radial-gradient(circle at bottom,#064e3b,transparent 35%),
#020617;
font-family:'Segoe UI';
color:white;
}

.container-box{
padding:40px;
}

.glass{
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
border-radius:25px;
padding:25px;
border:1px solid rgba(255,255,255,.1);
box-shadow:0 20px 50px rgba(0,0,0,.4);
}

.title{
font-size:35px;
font-weight:800;
background:
linear-gradient(90deg,#38bdf8,#a855f7);
-webkit-background-clip:text;
color:transparent;
}

.table{
color:white;
}

.table thead{
background:#38bdf8;
color:#020617;
}

.table tbody tr:hover{
background:rgba(255,255,255,.08);
}

</style>

</head>

<body>

<div class="container-box">

<div class="glass">

<div class="title">
📅 Attendance Management
</div>

<p class="text-secondary">
Mark student attendance
</p>

<!-- ✅ BULK ATTENDANCE FORM START -->
<form method="POST" action="/mark_bulk_attendance">

<div class="mb-4">

<label class="form-label text-white">
Select Attendance Date
</label>

<input
type="date"
name="attendance_date"
class="form-control"
value="{{ today }}"
required>

</div>

<table class="table">

<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Course</th>
<th>Present</th>
</tr>
</thead>

<tbody>

{% for student in students %}

<tr>

<td>{{ student.id }}</td>

<td>{{ student.name }}</td>

<td>{{ student.course }}</td>

<td>
    <input type="checkbox"
           name="present_students"
           value="{{ student.id }}">
</td>

</tr>

{% endfor %}

</tbody>

</table>

<button type="submit" class="btn btn-success mt-3">
    Submit Attendance
</button>

</form>
<!-- ✅ FORM END -->

<br>

<a href="/attendance_report" class="btn btn-info">
    View Attendance Report
</a>

<a href="/dashboard" class="btn btn-outline-light">
    Back Dashboard
</a>

</div>

</div>

</body>

</html>
