<!DOCTYPE html>

<html>

<head>

<title>Add Student</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">



<style>


body{

min-height:100vh;

background:
radial-gradient(circle,#1e3a8a,transparent 40%),
#020617;

font-family:'Segoe UI';

color:white;

display:flex;

align-items:center;

justify-content:center;

}



.form-box{


width:600px;


background:

rgba(255,255,255,.08);


backdrop-filter:blur(20px);


border-radius:30px;


padding:45px;


border:1px solid rgba(255,255,255,.15);


box-shadow:

0 30px 60px #000;


}



.title{

font-size:32px;

font-weight:800;

background:

linear-gradient(
90deg,#38bdf8,#a855f7
);

-webkit-background-clip:text;

color:transparent;

}



label{

color:#cbd5e1;

}



.form-control{

background:#020617!important;

border:1px solid #334155!important;

color:white!important;

padding:15px!important;

border-radius:15px!important;

}



.form-control:focus{

border-color:#38bdf8!important;

box-shadow:0 0 15px #38bdf8!important;

}



.btn-save{

background:

linear-gradient(
90deg,#22c55e,#06b6d4
);

border:none;

padding:14px;

border-radius:15px;

font-weight:bold;

color:white;

}



.btn-save:hover{

box-shadow:0 0 25px #22c55e;

}



</style>


</head>



<body>



<div class="form-box">


<div class="title">

➕ Add Student

</div>


<p class="text-secondary">

Enter student information

</p>



<form method="POST">



<label>Name</label>

<input class="form-control mb-3"
name="name"
placeholder="Student name"
required>



<label>Course</label>

<input class="form-control mb-3"
name="course"
placeholder="Course"
required>




<label>Joining Date</label>

<input
type="date"
class="form-control mb-4"
name="joining_date"
required>




<button class="btn-save w-100">

Save Student

</button>



<a href="/dashboard"
class="btn btn-outline-info w-100 mt-3">

Back to Dashboard

</a>



</form>


</div>



</body>


</html>
