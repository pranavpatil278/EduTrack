
<!DOCTYPE html>
<html>

<head>

    <title>Edit Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            margin:0;
            background:
            radial-gradient(circle at top,#1e1b4b,transparent 35%),
            radial-gradient(circle at bottom,#064e3b,transparent 35%),
            #020617;
            font-family:'Segoe UI';
            color:white;
        }

        .container-box{
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .glass{

            width:450px;

            background:rgba(255,255,255,.08);

            backdrop-filter:blur(20px);

            border-radius:25px;

            padding:35px;

            border:1px solid rgba(255,255,255,.1);

            box-shadow:0 20px 50px rgba(0,0,0,.4);

        }

        .title{

            font-size:34px;

            font-weight:bold;

            text-align:center;

            margin-bottom:25px;

            background:linear-gradient(90deg,#38bdf8,#a855f7);

            -webkit-background-clip:text;

            color:transparent;

        }

        .form-control{

            background:rgba(255,255,255,.1);

            color:white;

            border:none;

        }

        .form-control:focus{

            background:rgba(255,255,255,.15);

            color:white;

            box-shadow:none;

        }

        label{

            margin-top:10px;

            font-weight:600;

        }

        .btn-save{

            width:100%;

            margin-top:25px;

            background:#38bdf8;

            color:white;

            border:none;

        }

        .btn-save:hover{

            background:#0ea5e9;

        }

    </style>

</head>

<body>

<div class="container-box">

<div class="glass">

<div class="title">
✏️ Edit Student
</div>

<form method="POST">

<label>Name</label>

<input
type="text"
name="name"
class="form-control"
value="{{ student.name }}"
required>

<label>Course</label>

<input
type="text"
name="course"
class="form-control"
value="{{ student.course }}"
required>

<label>Joining Date</label>

<input
    type="date"
    name="joining_date"
    class="form-control"
    value="{{ student.joining_date.strftime('%Y-%m-%d') }}"
    required>

<button
type="submit"
class="btn btn-save">

Update Student

</button>

</form>

<br>

<a href="/dashboard"
class="btn btn-outline-light w-100">

Back to Dashboard

</a>

</div>

</div>

</body>

</html>
